name: Tests

# The suite exists to stay red without the fixes it guards. Nothing ran it
# before: build.yml only fires on push to main and delegates to the release
# workflow, so these tests were only ever exercised on a developer's machine.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # compileOnly at runtime (host-provided), but the tests run outside the
      # host, so the API jar has to be on the test classpath.
      - name: Fetch the pinned boss-plugin-api jar
        run: |
          mkdir -p build/downloaded-deps
          curl -fsSL -o build/downloaded-deps/boss-plugin-api.jar \
            "https://github.com/risa-labs-inc/boss-plugin-api/releases/download/v${API_VERSION}/boss-plugin-api-${API_VERSION}.jar"
        env:
          CI: 'true'
          API_VERSION: '1.0.73'

      # This PR depends on unreleased host contracts. Build their exact source
      # revision instead of pretending an existing SDK release contains them.
      - name: Read pinned host revision
        id: host
        shell: bash
        run: |
          revision=$(cat .github/bookmark-host-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout matching host contracts
        uses: actions/checkout@v4
        with:
          repository: manishakuhar/BossConsole
          ref: ${{ steps.host.outputs.revision }}
          path: build/host-contract
          persist-credentials: false

      - name: Build pinned bookmark contracts
        working-directory: build/host-contract
        run: ./gradlew :plugin-platform:plugin-bookmark-types:desktopJar --no-daemon

      - name: Install virtual display for Compose tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1

      - name: Run tests and build plugin
        run: >-
          xvfb-run -a ./gradlew test buildPluginJar --no-daemon
          -PbookmarkTypesJar=${{ github.workspace }}/build/host-contract/plugin-platform/plugin-bookmark-types/build/libs/plugin-bookmark-types-desktop-1.0.5.jar
        env:
          CI: 'true'
